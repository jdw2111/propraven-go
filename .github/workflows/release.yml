name: Release

# Go has no central package registry — `go get github.com/jdw2111/propraven-go@vX.Y.Z`
# resolves directly from this repo's tags. Tagging is sufficient to publish.
# This workflow just creates a GitHub Release for changelog visibility.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PackageVersion constant matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CONST=$(grep -oE 'PackageVersion = "[^"]+"' internal/version.go | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$TAG" != "$CONST" ]; then
            echo "Tag v$TAG doesn't match internal.PackageVersion \"$CONST\""
            exit 1
          fi

      - name: Run tests once more before release
        uses: actions/setup-go@v5
        with:
          go-version: "1.x"

      - run: go test -race ./...

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            --title "${GITHUB_REF#refs/tags/}"
